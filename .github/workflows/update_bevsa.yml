# Actualización BEVSA: descargas (dólar + curvas) + carga en BD (027, 029, 030)
# Ejecuta update/update_bevsa.py en cron o manual
name: Update BEVSA

on:
  schedule:
    # 2 veces al día: 12:30 y 18:30 Uruguay (UTC-3) = 15:30 y 21:30 UTC
    - cron: '30 15 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  update-bevsa:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome (BEVSA usa Selenium)
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 'stable'
          install-chromedriver: true
          install-dependencies: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BEVSA update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_ENVIRONMENT: production
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
        run: |
          python update/update_bevsa.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-bevsa-report-${{ github.run_id }}
          path: update_bevsa.txt
          retention-days: 7
