# DEPRECADO: Reemplazado por update_bevsa_dolar, update_bevsa_curva_nominal,
# update_bevsa_curva_real (workflows separados para evitar anti-bot acumulativo).
# Se mantiene solo para ejecución manual de los 3 juntos si es necesario.
name: Update BEVSA (all-in-one)

on:
  workflow_dispatch:

jobs:
  update-bevsa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome (BEVSA usa Selenium)
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 'stable'
          install-chromedriver: true
          install-dependencies: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BEVSA update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_ENVIRONMENT: production
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
        run: |
          python update/update_bevsa.py

      - name: Diagnostics (update/historicos)
        if: always()
        run: |
          echo "== git status (porcelain) =="
          git status --porcelain || true
          echo "== historicos listing =="
          python - <<'PY'
          import os
          import pathlib
          p = pathlib.Path("update/historicos")
          if not p.exists():
            print("update/historicos: (no existe)")
          else:
            for f in sorted(p.glob("*.xls*")):
              st = f.stat()
              print(f"{f.name}\t{st.st_size} bytes")
          PY
          echo "== dolar_bevsa_uyu.xlsx max date (si existe) =="
          python - <<'PY'
          import pathlib
          import pandas as pd
          p = pathlib.Path("update/historicos/dolar_bevsa_uyu.xlsx")
          if not p.exists():
            print("No existe:", p)
          else:
            df = pd.read_excel(p, sheet_name=0, header=0)
            if df.shape[1] == 0 or df.shape[0] == 0:
              print("Excel vacío")
            else:
              col0 = df.columns[0]
              s = pd.to_datetime(df[col0], errors="coerce")
              s = s.dropna()
              print("max:", s.max() if len(s) else None)
          PY

      - name: Commit and push update/historicos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update/historicos/
          if git diff --staged --quiet; then
            echo "No hay cambios en update/historicos/ para commitear."
          else
            git commit -m "chore(historicos): update Excels from BEVSA run [skip ci]"
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref_name }} || true
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          fi

      - name: Upload historicos (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historicos-${{ github.run_id }}
          path: update/historicos/*.xls*
          retention-days: 7

      - name: Upload update logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-logs-${{ github.run_id }}
          path: update/logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-bevsa-report-${{ github.run_id }}
          path: update_bevsa.txt
          retention-days: 7
