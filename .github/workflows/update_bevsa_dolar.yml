# Descarga dólar BEVSA + carga tipo de cambio en BD
name: Update BEVSA - Dólar

on:
  schedule:
    - cron: '30 15 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  update-dolar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 'stable'
          install-chromedriver: true
          install-dependencies: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dólar BEVSA
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
        run: python update/download/dolar_bevsa_uyu.py

      - name: Load tipo de cambio USD en BD
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_ENVIRONMENT: production
        run: python update/direct/027_tipo_cambio_usd.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update/historicos/
          if git diff --staged --quiet; then
            echo "No hay cambios en update/historicos/ para commitear."
          else
            git commit -m "chore(historicos): update dolar BEVSA [skip ci]"
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref_name }} || true
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-dolar-${{ github.run_id }}
          path: update/logs/*.log
          if-no-files-found: warn
          retention-days: 7
