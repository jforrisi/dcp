# Actualización completa de base de datos en producción
# Ejecuta update/update_database.py 2 veces al día (todo: download + direct + calculate)
name: Update Database (Producción)

on:
  schedule:
    # 2 veces al día: 12:00 y 18:00 Uruguay (UTC-3) = 15:00 y 21:00 UTC
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:  # Ejecución manual desde GitHub Actions

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Máximo 2 horas
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Chrome (para scripts Selenium)
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 'stable'
          install-chromedriver: true
          install-dependencies: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_ENVIRONMENT: production  # Activa headless en scripts de descarga (Azure / GitHub Actions)
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          # Opcional: para resolver Cloudflare Turnstile (BEVSA) automáticamente en CI
          # Crear secret CAPTCHA_API_KEY en el repo (API key de 2captcha.com)
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
        run: |
          python update/update_database.py

      - name: Commit and push update/historicos and data_raw
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update/historicos/ data_raw/
          if git diff --staged --quiet; then
            echo "No hay cambios en update/historicos/ o data_raw/ para commitear."
          else
            git commit -m "chore(data): update Excels from update_database run [skip ci]"
            git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref_name }} || true
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-report-${{ github.run_id }}
          path: update_database.txt
          retention-days: 7
